identity:
  name: remember
  author: memorysync
  label:
    en_US: Remember
description:
  human:
    en_US: Send the user's message (or a fact about the user) to MemorySync. The durable facts in it — preferences, personal details, decisions — are extracted and remembered across conversations; the text itself is not stored, and assistant messages are not stored as memories. Drop this node after your LLM node and pass the user's message.
  llm: Save what the user said to their long-term memory. MemorySync extracts the durable facts in it (preferences, facts about themselves, decisions) so they can be recalled in future conversations. Use when the user shares something worth remembering, and pass the user's own words.
parameters:
  - name: content
    type: string
    required: true
    form: llm
    label:
      en_US: Content
    human_description:
      en_US: The user's message or a fact about the user. Durable facts are extracted from it; the text itself is not stored.
    llm_description: What the user said, in their own words, or a fact about the user. Durable facts are extracted from it.
  - name: role
    type: select
    required: false
    default: user
    form: form
    label:
      en_US: Speaker role
    human_description:
      en_US: Who said it. User messages are sent to fact extraction; assistant messages are not stored as memories and are not counted.
    options:
      - value: user
        label:
          en_US: user
      - value: assistant
        label:
          en_US: assistant
  - name: user_id
    type: string
    required: false
    form: llm
    label:
      en_US: User ID (optional)
    human_description:
      en_US: Leave empty — the end-user id is detected from Dify automatically.
    llm_description: Optional override for the user this memory belongs to. Leave empty to use the current end user.
extra:
  python:
    source: tools/remember.py
