identity:
  name: search_memories
  author: memorysync
  label:
    en_US: Search Memories
description:
  human:
    en_US: Semantic search over the user's memories — returns a scored JSON list for branching or custom formatting.
  llm: Search the user's long-term memories semantically and get a scored list. Use when you need individual memories with scores rather than a ready-made context block.
parameters:
  - name: query
    type: string
    required: true
    form: llm
    label:
      en_US: Query
    human_description:
      en_US: What to search for.
    llm_description: The search query.
  - name: limit
    type: number
    required: false
    default: 5
    form: form
    label:
      en_US: Max results
    human_description:
      en_US: Maximum memories returned (1-25).
  - name: user_id
    type: string
    required: false
    form: llm
    label:
      en_US: User ID (optional)
    human_description:
      en_US: Leave empty — the end-user id is detected from Dify automatically.
    llm_description: Optional override for the user whose memories to search. Leave empty to use the current end user.
extra:
  python:
    source: tools/search_memories.py
