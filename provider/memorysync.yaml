identity:
  author: memorysync
  name: memorysync
  label:
    en_US: MemorySync
  description:
    en_US: Long-term user memory — recall context, remember facts, search and manage memories across conversations and apps.
  icon: icon.svg
credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: MemorySync API Key
    placeholder:
      en_US: ms_...
    help:
      en_US: Get an API key at app.memorysync.io → Settings → API Keys.
    url: https://app.memorysync.io
  base_url:
    type: text-input
    required: false
    label:
      en_US: Base URL (optional)
    placeholder:
      en_US: https://api.memorysync.io
    help:
      en_US: Leave empty for the MemorySync cloud. Set only for staging environments.
tools:
  - tools/recall_context.yaml
  - tools/remember.yaml
  - tools/search_memories.yaml
  - tools/forget_memory.yaml
extra:
  python:
    source: provider/memorysync.py
